# Hermes Configuration Example with Cardano Integration
# Place this file at ~/.hermes/config.toml
# Hermes reads this file at startup, so changes require a Hermes restart to take effect.

[global]
log_level = 'info'

# Telemetry configuration
[telemetry]
enabled = true
host = '127.0.0.1'
port = 3002

[telemetry.buckets.latency_submitted]
start = 500
end = 20000
buckets = 10

[telemetry.buckets.latency_confirmed]
start = 1000
end = 30000
buckets = 10

# REST API configuration
[rest]
# Disabled by default: local dev environments (e.g. Colima/Lima) often reserve or
# forward common ports like 3000, which can crash Hermes at startup.
enabled = false
host = '127.0.0.1'
port = 3030

# Mode configuration - which relaying features to enable
[mode]

# Whether to enable client worker
[mode.clients]
enabled = true
refresh = true
misbehaviour = true

# Whether to enable connection worker
[mode.connections]
enabled = true

# Whether to enable channel worker
[mode.channels]
enabled = true

# Whether to enable packet worker (the main relayer)
[mode.packets]
enabled = true
clear_interval = 100
clear_on_start = true
tx_confirmation = true


#
# CARDANO CHAIN CONFIGURATION
#
[[chains]]
type = 'Cardano'
id = 'cardano-devnet'

# Gateway gRPC endpoint - this is your NestJS Gateway
# Note: Gateway gRPC listens on port 5001; its HTTP/REST server defaults to 8000.
gateway_url = 'http://localhost:5001'

# Cardano network ID (1 = mainnet, 0 = testnet)
network_id = 0

# Key configuration
key_name = 'cardano-relayer'
key_store_type = 'Test'  # or 'Memory' for production
# Note: Use absolute path, tilde expansion may not work
# key_store_folder = '/Users/yourusername/.hermes/keys'

# Account component for Hermes' legacy Cardano-shaped SLIP-0010 path.
# This is not wallet-compatible Ed25519-BIP32/CIP-1852 derivation; verify the
# derived address before funding it.
account = 0

# Maximum time per block for this chain.
max_block_time = '20000ms'

# Additional timestamp tolerance used when other chains validate headers that
# were produced from Cardano's accepted proof view.
#
# `caribic start` widens this local-only for `cardano-devnet`, because the
# accepted Cardano view can lag the live tip in the local stack.
clock_drift = '5s'

# When Hermes submits a Cardano transaction via the Gateway, the Gateway reports
# the Cardano inclusion block number. Hermes waits until the active Gateway
# light-client mode accepts that height before continuing the handshake or relay.
#
# These field names are retained for configuration compatibility with the retired
# Mithril mode. In the default stake-weighted-stability mode they control the
# accepted-height wait. The height is a Cardano block number, not a slot number.
mithril_certification_timeout = '30m'
mithril_poll_interval = '5s'
mithril_wait_log_interval = '30s'

# Trust threshold for client updates (2/3 = 0.66)
trust_threshold = { numerator = '2', denominator = '3' }

# Packet filter configuration
[chains.packet_filter]
policy = 'allow'
list = [
  # Cardano transfer channels are recreated across preprod/devnet setups.
  # Do not pin channel-0 here; Hermes must discover the currently open pair.
  ['transfer', '*'],
]
