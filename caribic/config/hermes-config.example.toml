# Hermes Configuration Example with Cardano Integration
# Place this file at ~/.hermes/config.toml
# Hermes reads this file at startup, so changes require a Hermes restart to take effect.

[global]
log_level = 'info'

# Telemetry configuration
[telemetry]
enabled = true
host = '127.0.0.1'
port = 3002

[telemetry.buckets.latency_submitted]
start = 500
end = 20000
buckets = 10

[telemetry.buckets.latency_confirmed]
start = 1000
end = 30000
buckets = 10

# REST API configuration
[rest]
# Disabled by default: local dev environments (e.g. Colima/Lima) often reserve or
# forward common ports like 3000, which can crash Hermes at startup.
enabled = false
host = '127.0.0.1'
port = 3030

# Mode configuration - which relaying features to enable
[mode]

# Whether to enable client worker
[mode.clients]
enabled = true
refresh = true
misbehaviour = true

# Whether to enable connection worker
[mode.connections]
enabled = true

# Whether to enable channel worker
[mode.channels]
enabled = true

# Whether to enable packet worker (the main relayer)
[mode.packets]
enabled = true
clear_interval = 100
clear_on_start = true
tx_confirmation = true


#
# CARDANO CHAIN CONFIGURATION
#
[[chains]]
type = 'Cardano'
id = 'cardano-devnet'

# Gateway gRPC endpoint - this is your NestJS Gateway
# Note: Gateway gRPC listens on port 5001; its HTTP/REST server defaults to 8000.
gateway_url = 'http://localhost:5001'
# Plaintext is accepted only for localhost/loopback endpoints. Remote Gateways
# must use an https:// URL. Public certificate authorities use native trust roots;
# set this only when the Gateway certificate is issued by a private CA.
# gateway_tls_ca_file = '/path/to/gateway-ca.pem'
# Optional file containing the bearer token expected by the Gateway's transaction RPCs.
# gateway_auth_token_file = '/run/secrets/cardano-gateway-token'
# Apply the same transport and authentication rules when an independent
# misbehaviour-witness Gateway is configured:
# misbehaviour_witness_gateway_url = 'https://witness-gateway.example:5001'
# misbehaviour_witness_gateway_tls_ca_file = '/path/to/witness-gateway-ca.pem'
# misbehaviour_witness_gateway_auth_token_file = '/run/secrets/cardano-witness-gateway-token'

# Trusted, operator-pinned deployment manifest used to authorize Gateway-built
# transactions before Hermes accesses the signing key. `caribic start` replaces
# this placeholder with an owner-only snapshot of the manifest selected by the
# active Cardano profile.
# Do not point this at a file supplied by the Gateway.
bridge_manifest_path = '__CARDANO_BRIDGE_MANIFEST_PATH__'

# Independent Cardano data sources used before every signature. `caribic start`
# replaces these placeholders with host-reachable Kupo and Ogmios HTTP URLs for
# the active network. For Demeter, base Kupo uses `dmtr-api-key`; Ogmios HTTP
# uses the authenticated key-prefixed hostname. A URL that already contains its
# matching key prefix does not also receive an API-key header file. Hermes
# refuses plaintext endpoints outside loopback.
signing_utxo_kupo_url = '__CARDANO_SIGNING_KUPO_URL__'
signing_ogmios_url = '__CARDANO_SIGNING_OGMIOS_URL__'
# __CARDANO_SIGNING_KUPO_API_KEY_FILE__
# __CARDANO_SIGNING_OGMIOS_API_KEY_FILE__
# Optional private-CA roots for self-hosted HTTPS services:
# signing_utxo_kupo_tls_ca_file = '/path/to/kupo-ca.pem'
# signing_ogmios_tls_ca_file = '/path/to/ogmios-ca.pem'

# Local signing-policy limits. Transactions outside these bounds are rejected.
max_tx_fee_lovelace = 5000000
max_total_collateral_lovelace = 10000000
max_tx_size_bytes = 65536
max_external_output_lovelace = 5000000
max_total_protocol_output_lovelace = 50000000
max_wallet_lovelace_top_up = 5000000
max_validity_interval_slots = 3600

# Poll for a HostState heartbeat once a minute. The Gateway only builds a
# transaction when no ordinary IBC transition has created an anchor in the
# current Cardano epoch, so this does not produce one transaction per poll.
# The configured Cardano key must match the HostState deployment authority.
host_state_heartbeat_interval = '60s'

# Cardano network ID (1 = mainnet, 0 = testnet)
network_id = 0

# Key configuration
key_name = 'cardano-relayer'
key_store_type = 'Test'  # or 'Memory' for production
# Note: Use absolute path, tilde expansion may not work
# key_store_folder = '/Users/yourusername/.hermes/keys'

# Account component for Hermes' legacy Cardano-shaped SLIP-0010 path.
# This is not wallet-compatible Ed25519-BIP32/CIP-1852 derivation; verify the
# derived address before funding it.
account = 0

# Maximum time per block for this chain.
# `caribic start` widens this to 40s for the local Cardano devnet so connection
# handshakes have enough retry runway for the Gateway's accepted proof view.
max_block_time = '20000ms'

# Additional timestamp tolerance used when other chains validate headers that
# were produced from Cardano's accepted proof view.
#
# `caribic start` widens this local-only for `cardano-devnet`, because the
# accepted Cardano view can lag the live tip in the local stack.
clock_drift = '5s'

# When Hermes submits a Cardano transaction via the Gateway, the Gateway reports
# the Cardano inclusion block number. Hermes waits until the active Gateway
# light-client mode accepts that height before continuing the handshake or relay.
#
# These field names are retained for configuration compatibility with the retired
# Mithril mode. In the default stake-weighted-stability mode they control the
# accepted-height wait. The height is a Cardano block number, not a slot number.
mithril_certification_timeout = '30m'
mithril_poll_interval = '5s'
mithril_wait_log_interval = '30s'

# Trust threshold for client updates (2/3 = 0.66)
trust_threshold = { numerator = '2', denominator = '3' }

# Packet filter configuration
[chains.packet_filter]
policy = 'allow'
list = [
  # Cardano transfer channels are recreated across preprod/devnet setups.
  # Do not pin channel-0 here; Hermes must discover the currently open pair.
  ['transfer', '*'],
]
