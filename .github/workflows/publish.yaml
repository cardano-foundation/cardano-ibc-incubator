name: Build and publish Docker images

on:
  push:
    branches: [main]
    tags:
      - 'gateway/v*.*.*'
      - 'hermes/v*.*.*'
      - 'swap-client/v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The CF baseline action removes public registries for pull requests and branch
# builds. Consequently, those events publish only to the configured private
# registry, while component release tags publish to every configured registry.
permissions:
  contents: read

jobs:
  select-components:
    name: Select image components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      components: ${{ steps.select.outputs.components }}

    steps:
      - name: Select components from ref
        id: select
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ ! "${REF_NAME}" =~ ^(gateway|hermes|swap-client)/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Image release tags must use <component>/v<semver>." >&2
              echo "Examples: gateway/v1.2.3, hermes/v1.13.2, swap-client/v0.2.0-rc.1" >&2
              exit 1
            fi
            components="[\"${BASH_REMATCH[1]}\"]"
          else
            components='["gateway","hermes","swap-client"]'
          fi

          echo "Selected Earthly targets: ${components}"
          echo "components=${components}" >> "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build and publish ${{ matrix.component }}
    needs: select-components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.select-components.outputs.components) }}
    env:
      PRIVATE_DOCKER_REGISTRY_URL: ${{ secrets.GITLAB_DOCKER_REGISTRY_URL }}
      PRIVATE_DOCKER_REGISTRY_USER: Deploy-Token
      PRIVATE_DOCKER_REGISTRY_PASS: ${{ secrets.GITLAB_PKG_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Read component version
        id: component
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "${COMPONENT}" in
            gateway)
              version="$(node -p "require('./cardano/gateway/package.json').version")"
              version_source="cardano/gateway/package.json"
              ;;
            hermes)
              version="$(awk -F'"' '/^version[[:space:]]*=/{ print $2; exit }' relayer/crates/relayer-cli/Cargo.toml)"
              version_source="relayer/crates/relayer-cli/Cargo.toml"
              ;;
            swap-client)
              version="$(node -p "require('./dapps/ibc-swap/client/package.json').version")"
              version_source="dapps/ibc-swap/client/package.json"
              ;;
            *)
              echo "Unsupported image component: ${COMPONENT}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "${version_source} contains invalid component version '${version}'." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="${COMPONENT}/v${version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "Release tag '${GITHUB_REF_NAME}' does not match ${version_source} version ${version}." >&2
              echo "Expected tag: ${expected_tag}" >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
              echo "Release tags must point to a commit already merged into main." >&2
              exit 1
            fi
          fi

          echo "Using ${COMPONENT} version ${version} from ${version_source}."
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up trusted publishing credentials
        id: baseline
        uses: cardano-foundation/cf-gha-workflows/./actions/cf-gha-baseline@e02adcacc7178585dab0ca362adc83424654b324
        with:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_DOCKER_REGISTRY_URL: ${{ env.PRIVATE_DOCKER_REGISTRY_URL }}
          PRIVATE_DOCKER_REGISTRY_USER: ${{ env.PRIVATE_DOCKER_REGISTRY_USER }}
          PRIVATE_DOCKER_REGISTRY_PASS: ${{ env.PRIVATE_DOCKER_REGISTRY_PASS }}
          HUB_DOCKER_COM_USER: ${{ secrets.HUB_DOCKER_COM_USER }}
          HUB_DOCKER_COM_PASS: ${{ secrets.HUB_DOCKER_COM_PASS }}
          DOCKER_REGISTRIES: ${{ secrets.DOCKER_REGISTRIES }}

      # cf-gha-baseline cannot discover per-component versions at the root of
      # this monorepo. Recreate its standard tag set with the selected
      # component's version. On release tags, omit the component prefix because
      # it is only a matrix selector and '/' is not valid in a Docker tag.
      - name: Prepare component image tags
        id: image-tags
        shell: bash
        env:
          COMPONENT_VERSION: ${{ steps.component.outputs.version }}
          DOCKER_COMMIT_GHRUNID_TAG: ${{ steps.baseline.outputs.DOCKER_COMMIT_GHRUNID_TAG }}
          DOCKER_COMMIT_TAG: ${{ steps.baseline.outputs.DOCKER_COMMIT_TAG }}
          DOCKER_TAG: ${{ steps.baseline.outputs.DOCKER_TAG }}
          GIT_SHORT_COMMIT: ${{ steps.baseline.outputs.GIT_SHORT_COMMIT }}
          TRIGGERING_REF: ${{ steps.baseline.outputs.TRIGGERING_REF }}
        run: |
          case "${TRIGGERING_REF}" in
            tag)
              release_tag="v${COMPONENT_VERSION}"
              extra_tags="${release_tag} ${release_tag}-${GIT_SHORT_COMMIT} ${release_tag}-${GIT_SHORT_COMMIT}-GHRUN${GITHUB_RUN_ID}"
              ;;
            pr|branch)
              extra_tags="${COMPONENT_VERSION}-${DOCKER_COMMIT_TAG} ${COMPONENT_VERSION}-${DOCKER_COMMIT_GHRUNID_TAG} ${DOCKER_COMMIT_TAG} ${DOCKER_COMMIT_GHRUNID_TAG} ${DOCKER_TAG}"
              if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
                extra_tags="${extra_tags} latest"
              fi
              ;;
            *)
              echo "Unsupported triggering ref: ${TRIGGERING_REF}" >&2
              exit 1
              ;;
          esac

          echo "Publishing image tags: ${extra_tags}"
          echo "extra-tags=${extra_tags}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish image
        run: |
          earthly +${{ matrix.component }} \
            --PUSH=true \
            --DOCKER_REGISTRIES="${{ steps.baseline.outputs.DOCKER_REGISTRIES_FILTERED }}" \
            --DOCKER_IMAGES_EXTRA_TAGS="${{ steps.image-tags.outputs.extra-tags }}"
