name: Build and publish Docker images

on:
  push:
    branches: [main]
    tags:
      - 'gateway/v*.*.*'
      - 'hermes/v*.*.*'
      - 'swap-client/v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Branch builds have read-only GitHub tokens and only private registry credentials.
# Fork and Dependabot PRs build without publishing. Only tags receive release credentials.
permissions:
  actions: read
  contents: read

jobs:

  image-metadata:
    name: Validate image release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout component versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install workflow YAML reader
        run: python3 -m pip install PyYAML==6.0.2

      - name: Test image metadata checks
        run: python3 scripts/ci/image-metadata.test.py

      - name: Check pinned action and rehearse releases without publishing
        run: python3 scripts/ci/image-metadata.py

  docs-update:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/check-docs-update.yml
    with:
      workflow: .github/workflows/publish.yaml

  select-components:
    if: ${{ !cancelled() && needs.image-metadata.result == 'success' && ((github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && needs.docs-update.outputs.run_jobs == 'true' && (github.base_ref != 'main' || !startsWith(github.head_ref, 'docs/')))) }}
    needs: [docs-update, image-metadata]
    name: Select image components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.select.outputs.images }}

    steps:
      - name: Checkout branch inputs
        if: github.ref_type != 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select components from ref
        id: select
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ ! "${REF_NAME}" =~ ^(gateway|hermes|swap-client)/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Image release tags must use <component>/v<semver>." >&2
              echo "Examples: gateway/v1.2.3, hermes/v1.13.2, swap-client/v0.2.0-rc.1" >&2
              exit 1
            fi

            case "${BASH_REMATCH[1]}" in
              gateway)
                images='[{"component":"gateway","version_directory":"cardano/gateway"}]'
                ;;
              hermes)
                images='[{"component":"hermes","version_directory":"relayer/crates/relayer-cli"}]'
                ;;
              swap-client)
                images='[{"component":"swap-client","version_directory":"dapps/ibc-swap/client"}]'
                ;;
            esac
          else
            images='[{"component":"gateway","version_directory":"cardano/gateway"},{"component":"hermes","version_directory":"relayer/crates/relayer-cli"},{"component":"swap-client","version_directory":"dapps/ibc-swap/client"}]'
            if [[ -n "${DIFF_BASE_SHA:-}" && -n "${DIFF_HEAD_SHA:-}" ]] &&
               git diff --quiet --ignore-submodules=none --no-ext-diff \
                 "${DIFF_BASE_SHA}...${DIFF_HEAD_SHA}" -- \
                 relayer .gitmodules docker/hermes.Dockerfile .dockerignore \
                 Earthfile .github/workflows/publish.yaml .github/workflows/build-image.yaml \
                 'scripts/ci/image-*' 'scripts/ci/release-*'; then
              images=$(jq -c 'map(select(.component != "hermes"))' <<< "${images}")
            fi
          fi

          echo "Selected image matrix: ${images}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  pr-images:
    # PR builds honor the docs gate. Main builds publish the merged source.
    name: Build ${{ matrix.image.component }}
    needs: select-components
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-components.outputs.images) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      component: ${{ matrix.image.component }}
      version-directory: ${{ matrix.image.version_directory }}
      publish: ${{ (github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    secrets:
      DOCKER_REGISTRIES: ${{ (github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && secrets.DOCKER_REGISTRIES || '' }}
      PRIVATE_DOCKER_REGISTRY_URL: ${{ (github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && secrets.GITLAB_DOCKER_REGISTRY_URL || '' }}
      PRIVATE_DOCKER_REGISTRY_PASS: ${{ (github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && secrets.GITLAB_PKG_REGISTRY_TOKEN || '' }}

  release-images:
    name: Release ${{ matrix.image.component }}
    needs: select-components
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-components.outputs.images) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      component: ${{ matrix.image.component }}
      version-directory: ${{ matrix.image.version_directory }}
      publish: true
    secrets:
      DOCKER_REGISTRIES: ${{ secrets.DOCKER_REGISTRIES }}
      PRIVATE_DOCKER_REGISTRY_URL: ${{ secrets.GITLAB_DOCKER_REGISTRY_URL }}
      PRIVATE_DOCKER_REGISTRY_PASS: ${{ secrets.GITLAB_PKG_REGISTRY_TOKEN }}
      HUB_DOCKER_COM_USER: ${{ secrets.HUB_DOCKER_COM_USER }}
      HUB_DOCKER_COM_PASS: ${{ secrets.HUB_DOCKER_COM_PASS }}

  gateway-release:
    name: Publish gateway GitHub Release
    needs: release-images
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'gateway/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download gateway release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-release
          path: ${{ runner.temp }}/gateway-release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="${RUNNER_TEMP}/gateway-release"
          image_tag="${RELEASE_TAG#gateway/}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${release_dir}/notes.md"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file "${release_dir}/notes.md"
          fi
          gh release upload "${RELEASE_TAG}" \
            "${release_dir}/cardano-gateway-manifests-${image_tag}.tar.gz" --clobber
