name: Build and publish Docker images

on:
  push:
    tags:
      - 'gateway/v*.*.*'
      - 'hermes/v*.*.*'
      - 'swap-client/v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PRs have read-only GitHub tokens and only private registry credentials.
# Fork and Dependabot PRs build without publishing. Only tags receive release credentials.
permissions:
  contents: read

jobs:
  select-components:
    name: Select image components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.select.outputs.images }}

    steps:
      - name: Checkout PR inputs
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select components from ref
        id: select
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ ! "${REF_NAME}" =~ ^(gateway|hermes|swap-client)/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Image release tags must use <component>/v<semver>." >&2
              echo "Examples: gateway/v1.2.3, hermes/v1.13.2, swap-client/v0.2.0-rc.1" >&2
              exit 1
            fi

            case "${BASH_REMATCH[1]}" in
              gateway)
                images='[{"component":"gateway","version_directory":"cardano/gateway"}]'
                ;;
              hermes)
                images='[{"component":"hermes","version_directory":"relayer/crates/relayer-cli"}]'
                ;;
              swap-client)
                images='[{"component":"swap-client","version_directory":"dapps/ibc-swap/client"}]'
                ;;
            esac
          else
            images='[{"component":"gateway","version_directory":"cardano/gateway"},{"component":"hermes","version_directory":"relayer/crates/relayer-cli"},{"component":"swap-client","version_directory":"dapps/ibc-swap/client"}]'
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] &&
               git diff --quiet --ignore-submodules=none --no-ext-diff \
                 "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- \
                 relayer .gitmodules docker/hermes.Dockerfile .dockerignore \
                 Earthfile .github/workflows/publish.yaml .github/workflows/build-image.yaml \
                 'scripts/ci/image-*' 'scripts/ci/release-*'; then
              images=$(jq -c 'map(select(.component != "hermes"))' <<< "${images}")
            fi
          fi

          echo "Selected image matrix: ${images}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  pr-images:
    name: Build PR ${{ matrix.image.component }}
    needs: select-components
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-components.outputs.images) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      component: ${{ matrix.image.component }}
      version-directory: ${{ matrix.image.version_directory }}
      publish: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    secrets:
      DOCKER_REGISTRIES: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && secrets.DOCKER_REGISTRIES || '' }}
      PRIVATE_DOCKER_REGISTRY_URL: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && secrets.GITLAB_DOCKER_REGISTRY_URL || '' }}
      PRIVATE_DOCKER_REGISTRY_PASS: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && secrets.GITLAB_PKG_REGISTRY_TOKEN || '' }}

  release-images:
    name: Release ${{ matrix.image.component }}
    needs: select-components
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-components.outputs.images) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      component: ${{ matrix.image.component }}
      version-directory: ${{ matrix.image.version_directory }}
      publish: true
    secrets:
      DOCKER_REGISTRIES: ${{ secrets.DOCKER_REGISTRIES }}
      PRIVATE_DOCKER_REGISTRY_URL: ${{ secrets.GITLAB_DOCKER_REGISTRY_URL }}
      PRIVATE_DOCKER_REGISTRY_PASS: ${{ secrets.GITLAB_PKG_REGISTRY_TOKEN }}
      HUB_DOCKER_COM_USER: ${{ secrets.HUB_DOCKER_COM_USER }}
      HUB_DOCKER_COM_PASS: ${{ secrets.HUB_DOCKER_COM_PASS }}

  gateway-release:
    name: Publish gateway GitHub Release
    needs: release-images
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'gateway/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download gateway release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gateway-release
          path: ${{ runner.temp }}/gateway-release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="${RUNNER_TEMP}/gateway-release"
          image_tag="${RELEASE_TAG#gateway/}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${release_dir}/notes.md"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file "${release_dir}/notes.md"
          fi
          gh release upload "${RELEASE_TAG}" \
            "${release_dir}/cardano-gateway-manifests-${image_tag}.tar.gz" --clobber
