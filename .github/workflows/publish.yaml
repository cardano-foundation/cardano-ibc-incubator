name: Build and publish Docker images

on:
  push:
    tags:
      - 'gateway/v*.*.*'
      - 'hermes/v*.*.*'
      - 'swap-client/v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The CF baseline action removes public registries for pull requests and branch
# builds. Consequently, those events publish only to the configured private
# registry, while component release tags publish to every configured registry.
permissions:
  contents: read

jobs:
  select-components:
    name: Select image components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.select.outputs.images }}

    steps:
      - name: Checkout PR inputs
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select components from ref
        id: select
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ ! "${REF_NAME}" =~ ^(gateway|hermes|swap-client)/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Image release tags must use <component>/v<semver>." >&2
              echo "Examples: gateway/v1.2.3, hermes/v1.13.2, swap-client/v0.2.0-rc.1" >&2
              exit 1
            fi

            case "${BASH_REMATCH[1]}" in
              gateway)
                images='[{"component":"gateway","version_directory":"cardano/gateway"}]'
                ;;
              hermes)
                images='[{"component":"hermes","version_directory":"relayer/crates/relayer-cli"}]'
                ;;
              swap-client)
                images='[{"component":"swap-client","version_directory":"dapps/ibc-swap/client"}]'
                ;;
            esac
          else
            images='[{"component":"gateway","version_directory":"cardano/gateway"},{"component":"hermes","version_directory":"relayer/crates/relayer-cli"},{"component":"swap-client","version_directory":"dapps/ibc-swap/client"}]'
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] &&
               git diff --quiet --ignore-submodules=none --no-ext-diff \
                 "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- \
                 relayer .gitmodules docker/hermes.Dockerfile .dockerignore \
                 Earthfile .github/workflows/publish.yaml; then
              images=$(jq -c 'map(select(.component != "hermes"))' <<< "${images}")
            fi
          fi

          echo "Selected image matrix: ${images}"
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build and publish ${{ matrix.image.component }}
    needs: select-components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-components.outputs.images) }}
    env:
      PRIVATE_DOCKER_REGISTRY_URL: ${{ secrets.GITLAB_DOCKER_REGISTRY_URL }}
      PRIVATE_DOCKER_REGISTRY_USER: Deploy-Token
      PRIVATE_DOCKER_REGISTRY_PASS: ${{ secrets.GITLAB_PKG_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Set up trusted publishing credentials
        id: baseline
        uses: cardano-foundation/cf-gha-workflows/./actions/cf-gha-baseline@9d6fdaf043772b4f9eb1ea4bcc994dc30b515a96
        with:
          GITHUB_TOKEN: ${{ github.token }}
          PRIVATE_DOCKER_REGISTRY_URL: ${{ env.PRIVATE_DOCKER_REGISTRY_URL }}
          PRIVATE_DOCKER_REGISTRY_USER: ${{ env.PRIVATE_DOCKER_REGISTRY_USER }}
          PRIVATE_DOCKER_REGISTRY_PASS: ${{ env.PRIVATE_DOCKER_REGISTRY_PASS }}
          HUB_DOCKER_COM_USER: ${{ secrets.HUB_DOCKER_COM_USER }}
          HUB_DOCKER_COM_PASS: ${{ secrets.HUB_DOCKER_COM_PASS }}
          DOCKER_REGISTRIES: ${{ secrets.DOCKER_REGISTRIES }}
          artifact-version-directory: ${{ matrix.image.version_directory }}

      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          COMPONENT: ${{ matrix.image.component }}
          COMPONENT_VERSION: ${{ steps.baseline.outputs.GUESSED_ARTIFACT_VERSION }}
        run: |
          expected_tag="${COMPONENT}/v${COMPONENT_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match ${COMPONENT} version ${COMPONENT_VERSION}." >&2
            echo "Expected tag: ${expected_tag}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already merged into main." >&2
            exit 1
          fi

      - name: Build and publish image
        run: |
          earthly +${{ matrix.image.component }} \
            --PUSH=true \
            --DOCKER_REGISTRIES="${{ steps.baseline.outputs.DOCKER_REGISTRIES_FILTERED }}" \
            --DOCKER_IMAGES_EXTRA_TAGS="${{ steps.baseline.outputs.EARTHLY_DOCKER_IMAGES_EXTRA_TAGS }}"

      - name: Prepare gateway release
        if: github.ref_type == 'tag' && matrix.image.component == 'gateway'
        shell: bash
        env:
          REGISTRIES: ${{ steps.baseline.outputs.DOCKER_REGISTRIES_FILTERED }}
          IMAGE_TAG: ${{ steps.baseline.outputs.DOCKER_TAG }}
        run: |
          release_dir="${RUNNER_TEMP}/gateway-release"
          mkdir -p "${release_dir}"
          archive="cardano-gateway-manifests-${IMAGE_TAG}.tar.gz"
          tar -czf "${release_dir}/${archive}" manifests

          read -ra registries <<< "${REGISTRIES}"
          public_images=0
          {
            echo 'Published Cardano Gateway container images:'
            for registry in "${registries[@]}"; do
              case "${registry}" in
                ghcr.io/*|docker.io/*) ;;
                *) continue ;;
              esac
              image="${registry}/cardano-ibc-gateway"
              digest=$(docker buildx imagetools inspect "${image}:${IMAGE_TAG}" \
                --format '{{json .Manifest}}' | \
                jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
              printf "\n\`%s:%s\`\n\n\`%s@%s\`\n\n\`\`\`bash\ndocker pull %s:%s\n\`\`\`\n" \
                "${image}" "${IMAGE_TAG}" "${image}" "${digest}" "${image}" "${IMAGE_TAG}"
              public_images=$((public_images + 1))
            done
            if [[ "${public_images}" == 0 ]]; then
              echo 'No public gateway image registry is configured.' >&2
              exit 1
            fi
            printf "\nThe image includes tracked bridge manifests at \`/usr/src/app/manifests\`.\n"
            printf "\nFor preprod, set \`BRIDGE_MANIFEST_PATH=/usr/src/app/manifests/preprod/cardano-preprod-bridge-manifest.json\`.\n"
            printf "\nThe tracked manifests are also attached as \`%s\`.\n" "${archive}"
          } > "${release_dir}/notes.md"

      - name: Upload gateway release files
        if: github.ref_type == 'tag' && matrix.image.component == 'gateway'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-release
          path: ${{ runner.temp }}/gateway-release/
          if-no-files-found: error
          overwrite: true

  gateway-release:
    name: Publish gateway GitHub Release
    needs: build-and-publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'gateway/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download gateway release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gateway-release
          path: ${{ runner.temp }}/gateway-release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="${RUNNER_TEMP}/gateway-release"
          image_tag="${RELEASE_TAG#gateway/}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${release_dir}/notes.md"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file "${release_dir}/notes.md"
          fi
          gh release upload "${RELEASE_TAG}" \
            "${release_dir}/cardano-gateway-manifests-${image_tag}.tar.gz" --clobber
