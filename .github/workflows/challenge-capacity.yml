name: Probabilistic challenge capacity

on:
  pull_request:
    paths:
      - 'cosmos/cardano-probabilistic-light-client-*/**'
      - 'cardano/gateway/src/query/**'
      - 'cardano/gateway/src/config/**'
      - 'caribic/src/chains/network_limits.rs'
      - 'caribic/src/chains/cosmos_profiles/hermes.rs'
      - 'caribic/config/hermes-config.example.toml'
      - 'chains/*/configuration/hermes/config.toml'
      - 'chains/cosmos/**'
      - 'tests/challenge-capacity-relayer/**'
      - 'relayer'
      - '.github/workflows/challenge-capacity.yml'
  workflow_dispatch:

jobs:
  destination:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        major: ['8', '10']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: cosmos/cardano-probabilistic-light-client-v${{ matrix.major }}/go.mod
          cache-dependency-path: cosmos/cardano-probabilistic-light-client-v${{ matrix.major }}/go.sum
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.91.1'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/challenge-capacity-relayer/target
          key: challenge-relayer-${{ runner.os }}-${{ hashFiles('tests/challenge-capacity-relayer/Cargo.lock') }}-${{ hashFiles('relayer/Cargo.lock') }}
      - name: Load shipped configurations with the pinned Hermes parser
        run: cargo test --locked --manifest-path tests/challenge-capacity-relayer/Cargo.toml --test shipped_configs
      - name: Verify checkpoint expiry, challenge capacity and restart recovery
        shell: bash
        env:
          GOWORK: off
        run: |
          set -o pipefail
          cd cosmos/cardano-probabilistic-light-client-v${{ matrix.major }}
          go test -run 'TestOnlySnapshotStorage|TestAppAdmitsSnapshotChallenge|TestSignedPartialStakeUpload|TestSignedMaximumObservation|TestAppFailedStagedRecovery|TestAppFollowingEpochActivation|TestAppLateMithrilCertificate|TestSnapshotHostReplacement|TestEpochChallenge' -count=1 -v | tee "$RUNNER_TEMP/challenge-v${{ matrix.major }}.log"
      - name: Verify checkpoint expiry during staged activation
        if: matrix.major == '8'
        working-directory: cosmos/cardano-probabilistic-light-client-core
        env:
          GOWORK: off
        run: go test ./state -run 'TestSnapshotCheckpoint|TestSnapshotStaging|TestSnapshotProposal|TestFailedSnapshotRecovery|TestSnapshotRecoveryRechecks|TestCrossLanguageObservation|TestMaximumObservationFitsResponseWindow|TestRetainedReceipt|TestAlternativeRetainsEvidence|TestHost|TestPendingStakeWindow' -count=1 -v
      - name: Build the destination image with the measured dependencies
        run: >-
          docker compose -f chains/cosmos/docker-compose.yml
          --profile v${{ matrix.major }}-classic build v${{ matrix.major }}-classic
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: challenge-capacity-v${{ matrix.major }}
          path: ${{ runner.temp }}/challenge-v${{ matrix.major }}.log
