name: Local v8 probabilistic recovery acceptance

on:
  pull_request:
    paths:
      - 'cosmos/cardano-probabilistic-light-client-core/**'
      - 'cosmos/cardano-probabilistic-light-client-v8/**'
      - 'cosmos/cardano-probabilistic-light-client-v10/**'
      - 'caribic/**'
      - 'chains/cosmos/**'
      - '.github/workflows/probabilistic-v8-acceptance.yml'
  workflow_dispatch:

jobs:
  host-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cosmos/cardano-probabilistic-light-client-core/go.mod
          cache-dependency-path: cosmos/cardano-probabilistic-light-client-core/go.sum
      - name: Check adapter parity
        run: node scripts/ci/check-light-client-parity.mjs
      - name: Test the shared verifier and host interruption policy
        working-directory: cosmos/cardano-probabilistic-light-client-core
        run: go test ./...
  challenge-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [challenge-recovery, deadline-ordering]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cosmos/cardano-probabilistic-light-client-v8/go.mod
          cache-dependency-path: cosmos/cardano-probabilistic-light-client-v8/go.sum
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.91.1'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            caribic/target
          key: caribic-v8-acceptance-${{ runner.os }}-${{ hashFiles('caribic/Cargo.lock') }}
      - name: Run through Caribic with real committed deadlines
        run: |
          set -o pipefail
          cargo run --locked --manifest-path caribic/Cargo.toml -- test \
            --light-client ${{ matrix.scenario }} --chain cosmos --network v8-classic \
            2>&1 | tee /tmp/caribic-v8-acceptance.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-v8-${{ matrix.scenario }}
          include-hidden-files: true
          path: |
            .caribic/test-artifacts/
            /tmp/caribic-v8-acceptance.log
