name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  npm_config_audit: false
  npm_config_fund: false
  CARGO_TERM_COLOR: always

jobs:
  aiken-changes:
    name: Detect Aiken Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aiken_changed: ${{ steps.detect.outputs.aiken_changed }}
      aiken_files_changed: ${{ steps.detect.outputs.aiken_files_changed }}
      aiken_pr_changed: ${{ steps.detect.outputs.aiken_pr_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Aiken change detector
        run: node --test scripts/ci/detect-aiken-semantic-changes.test.mjs

      - name: Detect Aiken-relevant changes
        id: detect
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_AFTER_SHA: ${{ github.event.after }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set_outputs() {
            {
              echo "aiken_changed=$1"
              echo "aiken_files_changed=$2"
              echo "aiken_pr_changed=$3"
            } >> "$GITHUB_OUTPUT"
          }

          validate_classification() {
            jq -e '
              type == "object" and
              (.aikenFilesChanged | type == "boolean") and
              (.aikenRelevantChanged | type == "boolean") and
              (.changedFiles | type == "array" and all(.[]; type == "string")) and
              (.reasons | type == "array" and all(.[]; type == "string"))
            ' >/dev/null <<<"$1"
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            set_outputs true true true
            echo "Running Aiken jobs for non-PR event ${{ github.event_name }}."
            exit 0
          fi

          pr_merge_base=$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}" || true)
          if [ -z "${pr_merge_base}" ]; then
            echo "Could not resolve the PR merge base; running the full suite."
            set_outputs true true true
            exit 0
          fi

          if ! full_pr=$(node scripts/ci/detect-aiken-semantic-changes.mjs \
            "${pr_merge_base}" "${PR_HEAD_SHA}"); then
            echo "Aiken detector failed; running the full suite."
            set_outputs true true true
            exit 0
          fi
          if ! validate_classification "${full_pr}"; then
            echo "Aiken detector returned an invalid full-PR result; running the full suite."
            set_outputs true true true
            exit 0
          fi

          classification="${full_pr}"
          if [ "${EVENT_ACTION}" = "synchronize" ]; then
            if ! classification=$(node scripts/ci/detect-aiken-semantic-changes.mjs \
              "${EVENT_BEFORE_SHA}" "${EVENT_AFTER_SHA}"); then
              echo "Aiken update detector failed; running the full suite."
              set_outputs true true true
              exit 0
            fi
            if ! validate_classification "${classification}"; then
              echo "Aiken detector returned an invalid update result; running the full suite."
              set_outputs true true true
              exit 0
            fi
          fi

          aiken_files_changed=$(jq -r '.aikenFilesChanged' <<<"${full_pr}")
          aiken_changed=$(jq -r '.aikenRelevantChanged' <<<"${classification}")
          aiken_pr_changed=$(jq -r '.aikenRelevantChanged' <<<"${full_pr}")
          jq -r '.reasons[]?' <<<"${classification}"

          # A synchronize event compares only the newly pushed commits. If the
          # complete PR still contains Aiken changes, reuse the previous head's
          # result only when the relevant checks passed against an unchanged base.
          if [ "${EVENT_ACTION}" = "synchronize" ] && \
            [ "${aiken_changed}" = "false" ] && \
            [ "${aiken_pr_changed}" = "true" ]; then
              can_reuse=true

              if ! git merge-base --is-ancestor "${EVENT_BEFORE_SHA}" "${EVENT_AFTER_SHA}"; then
                echo "Previous PR head is not an ancestor; running the full suite."
                can_reuse=false
              fi

              if [ "${can_reuse}" = "true" ]; then
                if previous_runs=$(gh api --method GET \
                  "repos/${REPOSITORY}/actions/workflows/ci.yml/runs" \
                  -f head_sha="${EVENT_BEFORE_SHA}" \
                  -f event=pull_request \
                  -f per_page=10); then
                  if ! previous_run=$(jq -c \
                    --arg before "${EVENT_BEFORE_SHA}" \
                    --arg base "${PR_BASE_SHA}" \
                    --argjson pr "${PR_NUMBER}" '
                      [.workflow_runs[] |
                        select(.path == ".github/workflows/ci.yml") |
                        select(.head_sha == $before) |
                        select(.event == "pull_request") |
                        select(.status == "completed") |
                        select(any(.pull_requests[]?;
                          .number == $pr and .base.sha == $base))] |
                      if length == 1 then .[0] else empty end
                    ' <<<"${previous_runs}"); then
                    echo "Previous CI run response was invalid; running the full suite."
                    can_reuse=false
                  elif [ -z "${previous_run}" ]; then
                    echo "Could not identify one completed prior CI run for this PR and base; running the full suite."
                    can_reuse=false
                  else
                    previous_run_id=$(jq -r '.id' <<<"${previous_run}")
                    previous_run_attempt=$(jq -r '.run_attempt' <<<"${previous_run}")
                  fi
                else
                  echo "Could not read previous CI runs; running the full suite."
                  can_reuse=false
                fi
              fi

              if [ "${can_reuse}" = "true" ]; then
                if previous_jobs=$(gh api --method GET \
                  "repos/${REPOSITORY}/actions/runs/${previous_run_id}/jobs" \
                  -f filter=latest \
                  -f per_page=100); then
                  for required_check in \
                    "Cardano Onchain Aiken"; do
                    if ! check_result=$(jq -r \
                      --arg name "${required_check}" \
                      --argjson attempt "${previous_run_attempt}" '
                        [.jobs[] |
                          select(.name == $name and .run_attempt == $attempt)] |
                        if length == 1 then
                          "\(.[0].status):\(.[0].conclusion // "missing")"
                        else
                          "ambiguous:\(length)"
                        end
                      ' <<<"${previous_jobs}"); then
                      echo "Previous CI jobs response was invalid; running the full suite."
                      can_reuse=false
                    elif [ "${check_result}" != "completed:success" ]; then
                      echo "Previous ${required_check} result is ${check_result}; running the full suite."
                      can_reuse=false
                    fi
                  done
                  expected_base_step="Attest Aiken base ${PR_BASE_SHA}"
                  if ! base_result=$(jq -r \
                    --arg name "Cardano Onchain Aiken" \
                    --arg step "${expected_base_step}" \
                    --argjson attempt "${previous_run_attempt}" '
                      [.jobs[] |
                        select(.name == $name and .run_attempt == $attempt)] |
                      if length == 1 then
                        [.[0].steps[]? | select(.name == $step)] |
                        if length == 1 then
                          "\(.[0].status):\(.[0].conclusion // "missing")"
                        else
                          "ambiguous:\(length)"
                        end
                      else
                        "missing-job"
                      end
                    ' <<<"${previous_jobs}"); then
                    echo "Previous CI base attestation was invalid; running the full suite."
                    can_reuse=false
                  elif [ "${base_result}" != "completed:success" ]; then
                    echo "Previous ${expected_base_step} result is ${base_result}; running the full suite."
                    can_reuse=false
                  fi
                else
                  echo "Could not read jobs from the previous CI run; running the full suite."
                  can_reuse=false
                fi
              fi

              if [ "${can_reuse}" = "true" ]; then
                echo "The latest update changed only Aiken comments/whitespace or unrelated files."
                echo "Reusing successful Aiken checks from ${EVENT_BEFORE_SHA}."
              else
                aiken_changed=true
              fi
          fi

          set_outputs "${aiken_changed}" "${aiken_files_changed}" "${aiken_pr_changed}"
          if [ "${aiken_changed}" = "true" ]; then
            echo "Aiken-relevant changes detected."
          else
            echo "No Aiken-relevant changes detected; Aiken-heavy jobs can be skipped."
          fi

  docs-branch-guard:
    name: Docs Branch Guard
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check docs-only changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t changed_files < <(
            gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate \
              --jq '.[].filename'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files found for docs branch PR ${PR_NUMBER}."
            exit 1
          fi

          non_docs_files=()
          for file in "${changed_files[@]}"; do
            case "${file}" in
              *.md|*.mdx|*.txt|*.rst|*.adoc|*.asciidoc|LICENSE|NOTICE|AUTHORS)
                ;;
              docs/*.png|docs/*.jpg|docs/*.jpeg|docs/*.gif|docs/*.webp|docs/*.svg)
                ;;
              *)
                non_docs_files+=("${file}")
                ;;
            esac
          done

          if [ "${#non_docs_files[@]}" -gt 0 ]; then
            echo "Branches named docs/... may only edit documentation files."
            printf 'Non-documentation file: %s\n' "${non_docs_files[@]}"
            exit 1
          fi

          printf 'Documentation file: %s\n' "${changed_files[@]}"

  repo-invariants:
    name: Repository Invariants
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repo invariants
        run: node scripts/ci/check-repo-invariants.mjs

  quality-ratchets:
    name: Quality Ratchets
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check lint suppressions
        run: node scripts/ci/check-lint-suppressions.mjs

      - name: Check unused exports
        run: node scripts/ci/check-knip-ratchet.mjs

      - name: Check npm audit ratchet
        run: node scripts/ci/check-npm-audit-ratchet.mjs

  gateway:
    name: Cardano Gateway
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cardano/gateway/package-lock.json
            proto-types/package-lock.json
            packages/cardano-ibc-planner/package-lock.json
            packages/cardano-ibc-tx-builder/package-lock.json
            packages/cardano-ibc-trace-registry/package-lock.json
            packages/cardano-ibc-tx-builder-runtime/package-lock.json

      - name: Build proto types
        run: |
          npm ci --prefix proto-types
          npm run --prefix proto-types build

      - name: Build package dependencies
        run: |
          npm ci --prefix packages/cardano-ibc-planner
          npm run --prefix packages/cardano-ibc-planner build

          npm ci --prefix packages/cardano-ibc-tx-builder --legacy-peer-deps
          npm run --prefix packages/cardano-ibc-tx-builder build

          npm ci --prefix packages/cardano-ibc-trace-registry --legacy-peer-deps
          npm run --prefix packages/cardano-ibc-trace-registry build

          npm ci --prefix packages/cardano-ibc-tx-builder-runtime --legacy-peer-deps
          npm run --prefix packages/cardano-ibc-tx-builder-runtime build

      - name: Prune package-local installs for gateway
        run: |
          rm -rf packages/cardano-ibc-planner/node_modules
          rm -rf packages/cardano-ibc-tx-builder-runtime/node_modules
          npm ci --prefix packages/cardano-ibc-tx-builder --omit=dev --legacy-peer-deps
          npm ci --prefix packages/cardano-ibc-trace-registry --omit=dev --legacy-peer-deps

      - name: Install dependencies
        run: npm ci --prefix cardano/gateway --legacy-peer-deps

      - name: Lint
        run: npm run --prefix cardano/gateway lint:check

      - name: Build
        run: npm run --prefix cardano/gateway build

      - name: Test with coverage
        run: npm run --prefix cardano/gateway test:cov:ci

  proto-types:
    name: Proto Types
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: proto-types

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proto-types/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  typescript-packages:
    name: TypeScript Packages
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/cardano-ibc-planner/package-lock.json
            packages/cardano-ibc-tx-builder/package-lock.json
            packages/cardano-ibc-trace-registry/package-lock.json
            packages/cardano-ibc-tx-builder-runtime/package-lock.json

      - name: Build planner
        run: |
          npm ci --prefix packages/cardano-ibc-planner
          npm run --prefix packages/cardano-ibc-planner build
          npm test --prefix packages/cardano-ibc-planner

      - name: Build tx builder
        run: |
          npm ci --prefix packages/cardano-ibc-tx-builder --legacy-peer-deps
          npm run --prefix packages/cardano-ibc-tx-builder build
          npm test --prefix packages/cardano-ibc-tx-builder
          npm prune --omit=dev --prefix packages/cardano-ibc-tx-builder

      - name: Build trace registry
        run: |
          npm ci --prefix packages/cardano-ibc-trace-registry --legacy-peer-deps
          npm run --prefix packages/cardano-ibc-trace-registry build
          npm test --prefix packages/cardano-ibc-trace-registry

      - name: Build tx builder runtime
        run: |
          npm ci --prefix packages/cardano-ibc-tx-builder-runtime --legacy-peer-deps
          npm run --prefix packages/cardano-ibc-tx-builder-runtime build
          npm test --prefix packages/cardano-ibc-tx-builder-runtime

  deno-offchain:
    name: Cardano Offchain Deno
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    needs: aiken-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Build Aiken blueprint
        working-directory: cardano/onchain
        run: aiken build

      - name: Check formatting
        working-directory: cardano/offchain
        run: deno task fmt:check

      - name: Lint
        working-directory: cardano/offchain
        run: deno task lint

      - name: Type check
        working-directory: cardano/offchain
        run: deno task check

  aiken-static:
    name: Cardano Onchain Aiken Static
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/')) && (needs.aiken-changes.outputs.aiken_files_changed == 'true' || needs.aiken-changes.outputs.aiken_changed == 'true') }}
    needs: aiken-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cardano/onchain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Check formatting
        run: aiken fmt --check

      - name: Check fuzz imports stay in tests
        working-directory: .
        run: scripts/ci/check-aiken-fuzz-imports.sh

      # Keep syntax/blueprint/type errors separate from the fuzz matrix. These
      # checks should fail quickly and should not wait behind expensive
      # property-test execution.
      - name: Build blueprint
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        run: aiken build --deny

      - name: Type check without tests
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        run: aiken check --deny --skip-tests

  aiken-smoke:
    name: Cardano Onchain Aiken Smoke
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/')) && needs.aiken-changes.outputs.aiken_changed == 'true' }}
    needs: aiken-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cardano/onchain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      # This intentionally runs every test once. It catches broad collection or
      # fixture-construction failures before the deeper fuzz shards finish.
      - name: Run smoke test pass
        run: aiken check --deny --max-success 1 --property-coverage relative-to-tests > ../../aiken-smoke.json

  aiken-fuzz:
    name: Cardano Onchain Aiken Property/Fuzz (${{ matrix.suite }})
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/')) && needs.aiken-changes.outputs.aiken_changed == 'true' }}
    needs: aiken-changes
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 20 }}
    defaults:
      run:
        working-directory: cardano/onchain
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each shard is a protocol domain or a costly transition family. The
          # split keeps max-success=500 meaningful without putting all generated
          # cases behind one 30-minute job timeout.
          - suite: host-update-client
            match_tests: >-
              -m prop_host_update_client_
          - suite: host-update-connection
            match_tests: >-
              -m prop_host_update_connection_
          - suite: host-update-channel
            match_tests: >-
              -m prop_host_update_channel_
          - suite: host-handle-packet
            match_tests: >-
              -m prop_host_handle_packet_accepts_
              -m prop_host_handle_packet_rejects_channel_only_change
              -m prop_host_handle_packet_rejects_wrong_packet_key
          - suite: host-handle-packet-recv-successor
            match_tests: >-
              -m prop_host_handle_packet_rejects_recv_with_unrelated_channel_mutation
          # Capacity cases build the full 64-entry bounded state. Their seed
          # only varies unrelated metadata, so 350 cases keep each label above
          # the global 0.50% share ratchet without repeating the boundary 500
          # times. The slight margin accommodates new labeled properties.
          - suite: host-packet-capacity-receipt
            max_success: 350
            match_tests: >-
              -m prop_host_handle_packet_rejects_history_capacity_overflow
          - suite: host-packet-capacity-acknowledgement
            max_success: 350
            match_tests: >-
              -m prop_host_handle_packet_rejects_acknowledgement_capacity_overflow
          - suite: host-packet-capacity-commitment
            max_success: 350
            match_tests: >-
              -m prop_host_handle_packet_rejects_commitment_capacity_overflow
          - suite: host-bind-port
            match_tests: >-
              -m prop_host_bind_port_
          - suite: client
            match_tests: >-
              -m ibc/client/ics_007_tendermint_client/client_datum
              -m ibc/client/ics_007_tendermint_client/client_state
              -m ibc/client/ics_007_tendermint_client/misbehaviour_handle
              -m prop_client_update_
          - suite: connection
            match_tests: >-
              -m ibc/core/ics_003_connection_semantics/connection_datum
              -m ibc/core/ics_003_connection_semantics/connection_handshake_contract
              -m prop_conn_open_try_
              -m prop_tx_conn_open_try_
          - suite: channel-packet
            timeout_minutes: 30
            match_tests: >-
              -m ibc/core/ics_004/channel_datum_test/channel_handshake_contract
              -m ibc/core/ics_004/channel_datum_test/packet_lifecycle_contract
              -m prop_tx_packet_send_
          - suite: channel-packet-recv-callback
            match_tests: >-
              -m prop_tx_recv_packet_rejects_missing_application_callback
              -m prop_tx_recv_packet_rejects_callback_packet_data_mismatch
              -m prop_tx_recv_packet_rejects_callback_acknowledgement_mismatch
          - suite: channel-packet-recv-successor
            timeout_minutes: 30
            match_tests: >-
              -m prop_tx_recv_packet_accepts_atomic_successor_and_callback
              -m prop_tx_recv_packet_rejects_moved_port_binding
              -m prop_tx_recv_packet_rejects_unrelated_successor_mutation
          - suite: transfer-contract
            match_tests: >-
              -m ibc/apps/transfer/transfer_accounting_contract
          - suite: transfer-module-native-send
            match_tests: >-
              -m prop_transfer_module_native_send_
          - suite: transfer-module-native-timeout
            match_tests: >-
              -m prop_transfer_module_native_timeout_
          - suite: transfer-module-native-other
            match_tests: >-
              -m prop_transfer_module_recv_source_
              -m prop_transfer_module_native_ack_
              -m prop_transfer_module_root_
          - suite: transfer-module-voucher
            match_tests: >-
              -m prop_transfer_module_voucher_
              -m prop_transfer_module_recv_sink_
          - suite: voucher-contract
            match_tests: >-
              -m ibc/apps/transfer/voucher_metadata_contract
          - suite: voucher-policy-valid
            match_tests: >-
              -m prop_voucher_first_mint_policy_accepts_valid_metadata
              -m prop_tx_first_seen_voucher_mint_couples_registry_append
          - suite: voucher-policy-metadata-text
            match_tests: >-
              -m prop_voucher_first_mint_policy_rejects_wrong_name
              -m prop_voucher_first_mint_policy_rejects_wrong_ticker
              -m prop_voucher_first_mint_policy_rejects_wrong_description
              -m prop_voucher_first_mint_policy_rejects_wrong_full_denom
          - suite: voucher-policy-identity
            match_tests: >-
              -m prop_voucher_first_mint_policy_rejects_wrong_policy
              -m prop_voucher_first_mint_policy_rejects_wrong_reference_asset
              -m prop_tx_first_seen_voucher_mint_rejects_wrong_metadata_registry_coupled
          - suite: trace-append
            match_tests: >-
              -m prop_trace_registry_append_
          - suite: trace-rollover
            match_tests: >-
              -m prop_trace_registry_rollover_
          # The model property is substantially more expensive than the
          # rollover contract properties. Keep both at max-success=500 while
          # giving them independent job time budgets.
          - suite: trace-model
            timeout_minutes: 30
            match_tests: >-
              -m prop_model_trace_
          - suite: proofs
            match_tests: >-
              -m prop_proof_

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Run property shard
        run: |
          # Aiken emits JSON when stdout is redirected. The aggregate job merges
          # these per-shard reports and enforces the global label catalog once.
          aiken check \
            --deny \
            --max-success ${{ matrix.max_success || 500 }} \
            --property-coverage relative-to-tests \
            ${{ matrix.match_tests }} \
            > ../../aiken-${{ matrix.suite }}.json

      - name: Upload property report
        uses: actions/upload-artifact@v4
        with:
          name: aiken-fuzz-${{ matrix.suite }}
          path: aiken-${{ matrix.suite }}.json

  aiken:
    name: Cardano Onchain Aiken
    if: ${{ always() && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/')) }}
    needs:
      [aiken-changes, aiken-static, aiken-smoke, aiken-fuzz, tx-budgets, generated-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check shard status
        env:
          AIKEN_CHANGED: ${{ needs.aiken-changes.outputs.aiken_changed }}
          AIKEN_FILES_CHANGED: ${{ needs.aiken-changes.outputs.aiken_files_changed }}
          AIKEN_PR_CHANGED: ${{ needs.aiken-changes.outputs.aiken_pr_changed }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node - <<'NODE'
          // This aggregate job keeps the stable check name
          // "Cardano Onchain Aiken" while the actual work happens in parallel
          // prerequisite jobs.
          const needs = JSON.parse(process.env.NEEDS_JSON);
          for (const name of [
            'AIKEN_CHANGED',
            'AIKEN_FILES_CHANGED',
            'AIKEN_PR_CHANGED',
          ]) {
            if (!['true', 'false'].includes(process.env[name])) {
              console.error(`${name} has invalid value ${JSON.stringify(process.env[name])}.`);
              process.exit(1);
            }
          }
          const required = process.env.AIKEN_CHANGED === 'true'
            ? [
                'aiken-changes',
                'aiken-static',
                'aiken-smoke',
                'aiken-fuzz',
                'tx-budgets',
                'generated-artifacts',
              ]
            : [
                'aiken-changes',
                ...(process.env.AIKEN_FILES_CHANGED === 'true' ? ['aiken-static'] : []),
                'generated-artifacts',
              ];
          const failed = required
            .filter((name) => needs[name]?.result !== 'success')
            .map((name) => [name, needs[name]])
            .map(([name, value]) => `${name}: ${value?.result ?? 'missing'}`);
          if (failed.length > 0) {
            console.error(`Aiken shard failure(s): ${failed.join(', ')}`);
            process.exit(1);
          }
          if (process.env.AIKEN_CHANGED !== 'true') {
            console.log('No new Aiken semantics require the heavy test suite.');
          }
          NODE

      - name: Checkout
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download fuzz reports
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: aiken-fuzz-*
          path: aiken-fuzz-reports
          merge-multiple: true

      - name: Merge fuzz reports
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        run: node scripts/ci/merge-aiken-check-reports.mjs aiken-fuzz-reports aiken-fuzz.json

      # Labels are enforced globally, not per shard. That lets shard boundaries
      # follow runtime and protocol ownership without weakening coverage rules.
      - name: Check fuzz label coverage
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        run: node scripts/ci/check-aiken-fuzz-coverage.mjs aiken-fuzz.json

      - name: Attest Aiken base ${{ github.event.pull_request.base.sha || github.sha }}
        run: echo "Aiken checks are valid for base ${{ github.event.pull_request.base.sha || github.sha }}."

  tx-budgets:
    name: Cardano Tx Budgets
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/')) && needs.aiken-changes.outputs.aiken_changed == 'true' }}
    needs: aiken-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardano/gateway/package-lock.json

      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Build Aiken blueprint
        working-directory: cardano/onchain
        run: aiken build --deny

      - name: Collect Aiken execution units
        working-directory: cardano/onchain
        run: |
          # Tx budgets consume representative production transaction fixtures.
          # Fuzzers and other .test.ak cases are not deployed transactions, so
          # they should not inflate this job or affect the budget calculation.
          aiken check \
            --deny \
            --plain-numbers \
            --exact-match \
            -m 'ibc/core/ics_003_connection_semantics/connection_datum.{test_is_conn_open_try_valid_succeed}' \
            -m 'spending_transfer_module.{on_chan_open_try_succeed}' \
            -m 'spending_connection.{conn_open_ack_succeed}' \
            -m 'spending_channel.{send_packet_succeed}' \
            -m 'spending_channel/send_packet.{succeed_send_packet}' \
            -m 'ibc/core/ics_004/channel_datum_test/validate_send_packet.{succeed_at_packet_commitment_capacity}' \
            -m 'host_state_stt.{host_state_handle_packet_send_succeeds_at_commitment_capacity}' \
            -m 'spending_transfer_module.{transfer_escrow_succeed}' \
            -m 'minting_transfer_escrow_shard.{create_transfer_escrow_shard_succeeds}' \
            -m 'spending_channel.{recv_packet_succeed}' \
            -m 'spending_channel/recv_packet.{succeed_recv_packet}' \
            -m 'ibc/core/ics_004/channel_datum_test/validate_recv_packet.{succeed_at_packet_history_capacity}' \
            -m 'host_state_stt.{host_state_handle_packet_recv_succeeds_at_history_capacity}' \
            -m 'host_state_stt.{host_state_handle_packet_acknowledgement_succeeds_at_history_capacity}' \
            -m 'spending_channel.{acknowledge_packet_succeed}' \
            -m 'spending_channel/acknowledge_packet.{succeed_acknowledge_packet}' \
            -m 'spending_transfer_module.{on_acknowledgement_packet_result_succeed}' \
            -m 'spending_channel.{timeout_packet_succeed}' \
            -m 'spending_channel/timeout_packet.{succeed_timeout_unordered_packet}' \
            -m 'spending_transfer_module.{on_timeout_packet_mint_voucher_succeed}' \
            -m 'trace_registry.{trace_registry_insert_trace_succeeds_with_matching_voucher_mint}' \
            -m 'trace_registry_rollover.{trace_registry_rollover_insert_succeeds_and_preserves_old_shard}' \
            -m 'trace_registry_rollover.{trace_registry_advance_directory_succeeds_for_valid_rollover}' \
            -m 'minting_voucher.{test_mint_voucher}' \
            -m 'host_state_stt.{host_state_bind_tenth_port_succeeds_at_global_cap}' \
            -m 'minting_port.{mint_port_tenth_port_succeeds_at_module_cap}' \
            -m 'minting_identifier.{mints_identifier_from_nonce_output_reference}' \
            > ../../aiken-check.json

      - name: Install gateway dependencies
        run: npm ci --prefix cardano/gateway --legacy-peer-deps

      - name: Check transaction size and ex-unit budgets
        env:
          CARDANO_TX_BUDGET_MAX_TX_SIZE: 16384
          CARDANO_TX_BUDGET_HEADROOM_BYTES: 750
          CARDANO_TX_BUDGET_MAX_TX_EX_MEM: 140000000
          CARDANO_TX_BUDGET_MAX_TX_EX_STEPS: 100000000000
          CARDANO_TX_BUDGET_EX_UNIT_HEADROOM_BPS: 500
          CARDANO_TX_BUDGET_AIKEN_CHECK_JSON: ../../aiken-check.json
        run: npm run --prefix cardano/gateway check:tx-budgets

  generated-artifacts:
    name: Generated Artifacts
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    needs: aiken-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proto-types/package-lock.json

      - name: Setup Aiken
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Regenerate proto types
        run: |
          npm ci --prefix proto-types
          npm run --prefix proto-types codegen

      - name: Regenerate Aiken blueprint
        if: ${{ needs.aiken-changes.outputs.aiken_changed == 'true' }}
        working-directory: cardano/onchain
        run: aiken build --deny

      - name: Check generated artifacts
        run: scripts/ci/check-generated-artifacts-clean.sh

  go:
    name: Go (${{ matrix.module.name }})
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        module:
          - name: async-icq-v10
            path: cosmos/async-icq-v10
          - name: vesseloracle-v10
            path: cosmos/vesseloracle-v10
          - name: mithril-v10
            path: cosmos/cardano-mithril-light-client-v10
          - name: ibc-go-v10
            path: cosmos/cardano-probabilistic-light-client-v10
          - name: ibc-go-v8
            path: cosmos/cardano-probabilistic-light-client-v8
          - name: core
            path: cosmos/cardano-probabilistic-light-client-core

    defaults:
      run:
        working-directory: ${{ matrix.module.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: ${{ matrix.module.path }}/go.sum

      - name: Test
        env:
          GOWORK: off
        run: go test ./...

      - name: Vet non-generated packages
        env:
          GOWORK: off
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/api/' || true)
          if [ "${#packages[@]}" -gt 0 ]; then
            go vet "${packages[@]}"
          fi

  light-client-parity:
    name: Light Client Parity
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check v8/v10 parity
        run: node scripts/ci/check-light-client-parity.mjs

  rust:
    name: Rust
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            caribic/target
          key: ${{ runner.os }}-cargo-caribic-${{ hashFiles('caribic/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-caribic-

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file caribic/Cargo.lock

      - name: Check formatting
        run: cargo fmt --manifest-path caribic/Cargo.toml -- --check

      - name: Lint
        run: >
          cargo clippy --manifest-path caribic/Cargo.toml --locked --all-targets --
          -D warnings
          -A clippy::manual_is_multiple_of
          -A clippy::too_many_arguments

      - name: Check install build warnings
        run: >
          cargo rustc --manifest-path caribic/Cargo.toml --locked --release
          --bin caribic --
          -D warnings

      - name: Test
        run: cargo test --manifest-path caribic/Cargo.toml --locked

  hermes-relayer:
    name: Hermes Relayer
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relayer/target
          key: ${{ runner.os }}-cargo-hermes-relayer-${{ hashFiles('relayer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hermes-relayer-

      - name: Check formatting
        run: cargo fmt --manifest-path relayer/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --manifest-path relayer/Cargo.toml -p ibc-relayer --lib --tests -- -D warnings

      - name: Test
        run: cargo test --manifest-path relayer/Cargo.toml -p ibc-relayer --lib --locked -- --test-threads=1
