name: Cardano Gateway Image

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/gateway-image.yml"
      - "cardano/gateway/**"
      - "packages/cardano-ibc-planner/**"
      - "packages/cardano-ibc-trace-registry/**"
      - "packages/cardano-ibc-tx-builder/**"
      - "packages/cardano-ibc-tx-builder-runtime/**"
      - "proto-types/**"
      - "manifests/**"
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - ".dockerignore"
      - ".github/workflows/gateway-image.yml"
      - "cardano/gateway/**"
      - "packages/cardano-ibc-planner/**"
      - "packages/cardano-ibc-trace-registry/**"
      - "packages/cardano-ibc-tx-builder/**"
      - "packages/cardano-ibc-tx-builder-runtime/**"
      - "proto-types/**"
      - "manifests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/cardano-gateway

jobs:
  pull-request-build:
    name: Build Gateway image
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'docs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cardano/gateway/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gateway-image:
    name: Build and publish Gateway image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate semver tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Gateway release tags must use semver format, for example v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Cardano IBC Gateway
            org.opencontainers.image.description=Gateway service for Cardano IBC relayers

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cardano/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes_file="${RUNNER_TEMP}/gateway-release-notes.md"
          manifests_archive="${RUNNER_TEMP}/cardano-gateway-manifests-${IMAGE_TAG}.tar.gz"
          tar -czf "${manifests_archive}" manifests

          cat > "${notes_file}" <<EOF
          Published Cardano Gateway container image:

          - \`${IMAGE_NAME}:${IMAGE_TAG}\`
          - \`${IMAGE_NAME}@${IMAGE_DIGEST}\`

          The image includes tracked bridge manifests at:

          - \`/usr/src/app/manifests\`

          For example, a preprod Gateway can be started with:

          \`\`\`bash
          BRIDGE_MANIFEST_PATH=/usr/src/app/manifests/preprod/cardano-preprod-bridge-manifest.json
          \`\`\`

          The tracked manifests are also attached to this release as:

          - \`cardano-gateway-manifests-${IMAGE_TAG}.tar.gz\`

          Pull with:

          \`\`\`bash
          docker pull ${IMAGE_NAME}:${IMAGE_TAG}
          \`\`\`
          EOF

          if gh release view "${IMAGE_TAG}" >/dev/null 2>&1; then
            gh release edit "${IMAGE_TAG}" \
              --title "${IMAGE_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${IMAGE_TAG}" \
              --verify-tag \
              --title "${IMAGE_TAG}" \
              --notes-file "${notes_file}"
          fi

          gh release upload "${IMAGE_TAG}" "${manifests_archive}" --clobber
