services:
  app:
    container_name: gateway-app
    build:
      context: ../..
      dockerfile: cardano/gateway/Dockerfile
    ports:
      - "8000:8000"
      - "5001:5001"
    environment:
      PORT: 8000
    networks:
      - cardano_network
    volumes:
      - ./dist:/usr/src/app/dist
      - ../../chains/mithrils/data/aggregator/stores:/usr/chains/mithrils/data/aggregator/stores
      - ../offchain/deployments:/usr/src/app/cardano/offchain/deployments
      - ../../manifests:/usr/src/app/manifests:ro
    env_file:
      - .env

  bridge-history-sync:
    container_name: gateway-bridge-history-sync
    build:
      context: ../..
      dockerfile: cardano/gateway/Dockerfile
    command: ["node", "dist/scripts/yaci-bridge-history-sync.js"]
    restart: on-failure
    networks:
      - cardano_network
    volumes:
      - ./dist:/usr/src/app/dist
      - ../offchain/deployments:/usr/src/app/cardano/offchain/deployments
      - ../../manifests:/usr/src/app/manifests:ro
    env_file:
      - .env

  sp1-tendermint-prover:
    profiles: ["sp1"]
    container_name: sp1-tendermint-prover
    image: ${SP1_TENDERMINT_PROVER_IMAGE:-cardano-ibc-sp1-tendermint-prover:local}
    build:
      context: ../..
      dockerfile: cardano/sp1-tendermint-prover/Dockerfile
    restart: unless-stopped
    networks:
      - cardano_network
    environment:
      SP1_TENDERMINT_PROVER_BACKEND: ${SP1_TENDERMINT_PROVER_BACKEND:-cpu}
      SP1_TENDERMINT_NETWORK_MODE: ${SP1_TENDERMINT_NETWORK_MODE:-mainnet}
      SP1_TENDERMINT_NETWORK_PROOF_TIMEOUT_SECS: ${SP1_TENDERMINT_NETWORK_PROOF_TIMEOUT_SECS:-600}
      SP1_TENDERMINT_NETWORK_AUCTION_TIMEOUT_SECS: ${SP1_TENDERMINT_NETWORK_AUCTION_TIMEOUT_SECS:-30}
      SP1_TENDERMINT_NETWORK_MIN_AUCTION_PERIOD_SECS: ${SP1_TENDERMINT_NETWORK_MIN_AUCTION_PERIOD_SECS:-1}
      SP1_TENDERMINT_NETWORK_MAX_PRICE_PER_PGU: ${SP1_TENDERMINT_NETWORK_MAX_PRICE_PER_PGU:-}
      NETWORK_PRIVATE_KEY: ${NETWORK_PRIVATE_KEY:-}
      NETWORK_PRIVATE_KEY_FILE: ${NETWORK_PRIVATE_KEY_FILE:-}
      NETWORK_RPC_URL: ${NETWORK_RPC_URL:-}
      CARDANO_BLS_WRAPPER_STARTUP_TIMEOUT_SECS: ${CARDANO_BLS_WRAPPER_STARTUP_TIMEOUT_SECS:-600}
      CARDANO_BLS_WRAPPER_PROOF_TIMEOUT_SECS: ${CARDANO_BLS_WRAPPER_PROOF_TIMEOUT_SECS:-120}
    volumes:
      - ${CARDANO_BLS_WRAPPER_KEYS_HOST_PATH:-../sp1-tendermint-prover/keys-local}:/var/lib/cardano-ibc-wrapper:ro

networks:
  cardano_network:
    external: true
    name: cardano_ibc_net
