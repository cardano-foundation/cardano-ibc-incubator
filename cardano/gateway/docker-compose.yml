services:
  app:
    container_name: gateway-app
    build:
      context: ../..
      dockerfile: cardano/gateway/Dockerfile
    ports:
      - "8000:8000"
      - "5001:5001"
    environment:
      PORT: 8000
    networks:
      - cardano_network
    volumes:
      - ./dist:/usr/src/app/dist
      - ../../chains/mithrils/data/aggregator/stores:/usr/chains/mithrils/data/aggregator/stores
      - ../offchain/deployments:/usr/src/app/cardano/offchain/deployments
      - ../../manifests:/usr/src/app/manifests:ro
    env_file:
      - .env

  bridge-history-sync:
    container_name: gateway-bridge-history-sync
    build:
      context: ../..
      dockerfile: cardano/gateway/Dockerfile
    command: ["node", "dist/scripts/yaci-bridge-history-sync.js"]
    restart: on-failure
    networks:
      - cardano_network
    volumes:
      - ./dist:/usr/src/app/dist
      - ../offchain/deployments:/usr/src/app/cardano/offchain/deployments
      - ../../manifests:/usr/src/app/manifests:ro
    env_file:
      - .env

  sp1-tendermint-prover:
    profiles: ["sp1"]
    container_name: sp1-tendermint-prover
    build:
      context: ../../studies/sp1_tendermint_cardano
      dockerfile: prover-service/Dockerfile
    restart: unless-stopped
    networks:
      - cardano_network
    volumes:
      - ${CARDANO_BLS_WRAPPER_KEYS_HOST_PATH:-../../studies/sp1_tendermint_cardano/prover-service/keys-local}:/var/lib/cardano-ibc-wrapper:ro

networks:
  cardano_network:
    external: true
    name: cardano_ibc_net
