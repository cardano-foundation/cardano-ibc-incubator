name: ${GATEWAY_COMPOSE_PROJECT:-gateway}

services:
  app:
    container_name: ${GATEWAY_CONTAINER_NAME:-gateway-app}
    build:
      context: ../..
      dockerfile: cardano/gateway/Dockerfile
    ports:
      - "8000:8000"
      # Plaintext gRPC is intended for the co-hosted Hermes process only.
      - "${GRPC_PUBLISH_HOST:-127.0.0.1}:5001:5001"
    environment:
      PORT: 8000
      # The host-side port mapping below supplies the plaintext trust boundary.
      GRPC_HOST: 0.0.0.0
      CONSENSUS_HISTORY_CACHE_DIR: /var/lib/cardano-ibc/consensus-history
    networks:
      - cardano_network
      - history_network
    depends_on:
      bridge-history-postgres:
        condition: service_healthy
      bridge-history-sync:
        condition: service_started
    volumes:
      - consensus-history:/var/lib/cardano-ibc/consensus-history
      - ./dist:/usr/src/app/dist
      - ../../chains/mithrils/data/aggregator/stores:/usr/chains/mithrils/data/aggregator/stores
      - ../offchain/deployments:/usr/src/app/cardano/offchain/deployments:ro
      - ../../manifests:/usr/src/app/manifests:ro
    env_file:
      - .env

  bridge-history-sync:
    container_name: ${GATEWAY_HISTORY_CONTAINER_NAME:-gateway-bridge-history-sync}
    build:
      context: ../..
      dockerfile: cardano/gateway/Dockerfile
    command: ["node", "dist/scripts/yaci-bridge-history-sync.js"]
    restart: on-failure
    networks:
      - cardano_network
      - history_network
    depends_on:
      bridge-history-postgres:
        condition: service_healthy
    volumes:
      - ./dist:/usr/src/app/dist
      - ../offchain/deployments:/usr/src/app/cardano/offchain/deployments:ro
      - ../../manifests:/usr/src/app/manifests:ro
    env_file:
      - .env

  # This database belongs to the Gateway. Yaci Store is accessed only through REST.
  bridge-history-postgres:
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    restart: on-failure
    environment:
      POSTGRES_DB: ${HISTORY_DB_NAME:-bridge_history}
      POSTGRES_USER: ${HISTORY_DB_USERNAME:-bridge}
      POSTGRES_PASSWORD: ${HISTORY_DB_PASSWORD:-dbpass}
    ports:
      - "127.0.0.1:${BRIDGE_HISTORY_POSTGRES_PORT:-15434}:5432"
    volumes:
      - bridge-history:/var/lib/postgresql/data
    networks:
      - history_network
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  consensus-history:
  bridge-history:
    name: ${GATEWAY_HISTORY_VOLUME:-${GATEWAY_COMPOSE_PROJECT:-gateway}_bridge_history_${CARDANO_CHAIN_NETWORK_MAGIC:-42}}

networks:
  history_network:
    internal: true
  cardano_network:
    external: ${CARDANO_DOCKER_NETWORK_EXTERNAL:-true}
    name: ${CARDANO_DOCKER_NETWORK:-cardano_ibc_net}
