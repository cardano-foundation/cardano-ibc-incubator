[package]
name = "cardano-ibc-sp1-tendermint-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
alloy-primitives = "=1.5.7"
alloy-sol-types = "=1.5.7"
anyhow = "=1.0.102"
async-trait = "=0.1.89"
axum = "=0.7.9"
base64 = "=0.22.1"
hex = "=0.4.3"
ibc-proto = { version = "=0.51.1", default-features = false }
prost = "=0.13.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.1.0", default-features = false, features = ["native-gnark", "network"] }
tokio = { version = "=1.52.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tendermint-proto = "=0.40.4"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
