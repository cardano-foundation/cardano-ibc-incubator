services:
  postgres:
    image: postgres:15
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - POSTGRES_LOGGING=true
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db
    ports:
      - ${POSTGRES_PORT:-6432}:5432
    volumes:
      - ./${GATEWAY_POSTGRES_DATA_DIR:-postgres}:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      # Use pg_isready to check postgres is running. Substitute different
      # user `postgres` if you've setup differently to config/pgpass-mainnet
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ${POSTGRES_ARGS:--c maintenance_work_mem=1GB -c max_parallel_maintenance_workers=4}
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  yaci-store-postgres:
    image: postgres:15
    # Host-side manifest export/upgrade verifies retained history read-only.
    ports:
      - "127.0.0.1:${YACI_STORE_POSTGRES_PORT:-15432}:5432"
    environment:
      - POSTGRES_DB=yaci_store
      - POSTGRES_USER=yaci
      - POSTGRES_PASSWORD=dbpass
    volumes:
      - yaci_store_postgres_data:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yaci -d yaci_store" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  yaci-store:
    # 2.0.2.1 fixes CBOR parsing of post-protocol-11 preprod blocks
    # (2.0.0 dies with "CborException: Reserved additional information").
    image: bloxbean/yaci-store:2.0.2.1
    ports:
      - ${YACI_STORE_PORT:-8081}:8080
    depends_on:
      - yaci-store-postgres
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/app/config/application.properties
      - CARDANO_CHAIN_HOST=${CARDANO_CHAIN_HOST:?Set the public Cardano relay host}
      - CARDANO_CHAIN_PORT=${CARDANO_CHAIN_PORT:?Set the public Cardano relay port}
      - CARDANO_CHAIN_NETWORK_MAGIC=${CARDANO_CHAIN_NETWORK_MAGIC:?Select preprod or preview through Caribic}
      - YACI_SYNC_START_SLOT=${YACI_SYNC_START_SLOT:-0}
      - YACI_SYNC_START_BLOCKHASH=${YACI_SYNC_START_BLOCKHASH:-}
      - HISTORY_DB_HOST=yaci-store-postgres
      - HISTORY_DB_PORT=5432
      - HISTORY_DB_NAME=yaci_store
      - HISTORY_DB_USERNAME=yaci
      - HISTORY_DB_PASSWORD=dbpass
    volumes:
      - ./${YACI_GENESIS_DIR:-yaci/genesis}:/app/genesis:ro
      - ./yaci/config:/app/config:ro
      - ./${YACI_DATA_DIR:-yaci/data}:/app/data
      - ./${YACI_LOGS_DIR:-yaci/logs}:/app/logs
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

networks:
  default:
    name: cardano_ibc_net

secrets:
  postgres_db:
    file: ./config/secrets/postgres_db
  postgres_password:
    file: ./config/secrets/postgres_password
  postgres_user:
    file: ./config/secrets/postgres_user

volumes:
  yaci_store_postgres_data:
    name: ${YACI_STORE_POSTGRES_VOLUME:?YACI_STORE_POSTGRES_VOLUME must be set by Caribic runtime selection}
