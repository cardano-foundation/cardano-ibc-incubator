syntax = "proto3";
package ibc.lightclients.probabilistic.v1;
import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
option go_package = "github.com/cardano-foundation/cardano-ibc-incubator/cosmos/cardano-probabilistic-light-client-v10;probabilistic";
service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc ContinueClient(MsgContinueClient) returns (MsgContinueClientResponse);
}

message MsgContinueClient {
  option (gogoproto.goproto_getters) = false;
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string client_id = 2;
  // Permissionless bounded cleanup or continuation of already authorized recovery.
  uint32 operation = 3;
}

message MsgContinueClientResponse {
  option (gogoproto.goproto_getters) = false;
}
