syntax = "proto3";
package ibc.lightclients.probabilistic.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/cardano-foundation/cardano-ibc-incubator/proto-types/ibc/lightclients/probabilistic/v1";

message Height {
  option (gogoproto.goproto_getters) = false;

  uint64 revision_number = 1;
  uint64 revision_height = 2;
}

message StakeDistributionEntry {
  option (gogoproto.goproto_getters) = false;

  string pool_id = 1;
  uint64 stake = 2;
  bytes vrf_key_hash = 3;
  uint64 first_registration_slot = 4;
  // Exact relative active stake used for Praos leader eligibility. The
  // existing stake field remains the weight used by settlement scoring.
  uint64 relative_stake_numerator = 5;
  uint64 relative_stake_denominator = 6;
}

message EpochContext {
  option (gogoproto.goproto_getters) = false;

  uint64 epoch = 1;
  repeated StakeDistributionEntry stake_distribution = 2;
  bytes epoch_nonce = 3;
  uint64 slots_per_kes_period = 4;
  uint64 epoch_start_slot = 5;
  uint64 epoch_end_slot_exclusive = 6;
}

message OperationalCertificateCounter {
  option (gogoproto.goproto_getters) = false;

  bytes pool_id = 1;
  uint64 sequence_number = 2;
}

message ClientState {
  option (gogoproto.goproto_getters) = false;

  reserved 6, 18;
  reserved "heuristic_params", "pool_registration_cutoff_slot_exclusive";

  string chain_id = 1;
  Height latest_height = 2;
  Height frozen_height = 3;
  uint64 current_epoch = 4;
  google.protobuf.Duration trusting_period = 5 [(gogoproto.nullable) = false, (gogoproto.stdduration) = true];
  repeated string upgrade_path = 7;
  bytes host_state_nft_policy_id = 8;
  bytes host_state_nft_token_name = 9;
  repeated StakeDistributionEntry epoch_stake_distribution = 10;
  bytes epoch_nonce = 11;
  uint64 slots_per_kes_period = 12;
  uint64 current_epoch_start_slot = 13;
  uint64 current_epoch_end_slot_exclusive = 14;
  uint64 system_start_unix_ns = 15;
  uint64 slot_length_ns = 16;
  repeated EpochContext epoch_contexts = 17;
  // The latest authenticated Cardano block, which may be newer than
  // latest_height when rootless checkpoint updates are used for catch-up.
  Height latest_checkpoint_height = 19;
  string latest_checkpoint_block_hash = 20;
  uint64 latest_checkpoint_epoch = 21;
  uint64 max_kes_evolutions = 22;
  // Operational-certificate counters at latest_checkpoint_height.
  repeated OperationalCertificateCounter latest_checkpoint_operational_certificate_counters = 23;
  // Oldest height whose counter state can be reconstructed from the current
  // snapshot and the light client's private rollback history.
  Height operational_certificate_counter_history_start_height = 24;
  // Shelley-genesis activeSlotsCoefficient, kept as an exact rational.
  uint64 active_slot_coefficient_numerator = 25;
  uint64 active_slot_coefficient_denominator = 26;
}

message ConsensusState {
  option (gogoproto.goproto_getters) = false;

  uint64 timestamp = 1;
  bytes ibc_state_root = 2;
  string accepted_block_hash = 3;
  uint64 accepted_epoch = 4;
  uint64 unique_pools_count = 5;
  uint64 unique_stake_bps = 6;
  uint64 security_score_bps = 7;
}

message Misbehaviour {
  option (gogoproto.goproto_getters) = false;

  string client_id = 1 [deprecated = true];
  ProbabilisticHeader probabilistic_header_1 = 2 [(gogoproto.customname) = "ProbabilisticHeader1"];
  ProbabilisticHeader probabilistic_header_2 = 3 [(gogoproto.customname) = "ProbabilisticHeader2"];
}

message ProbabilisticBlock {
  option (gogoproto.goproto_getters) = false;

  Height height = 1;
  uint64 slot = 2;
  string hash = 3;
  reserved 4;
  uint64 epoch = 5;
  uint64 timestamp = 6;
  reserved 7;
  reserved 8;
  // Full block CBOR. A root-bearing anchor requires this representation so
  // its HostState transaction can be authenticated against the signed body.
  bytes block_cbor = 9;
  // Raw Cardano header CBOR. This compact representation is sufficient for
  // bridge blocks, descendant blocks, and rootless checkpoint anchors.
  bytes header_cbor = 10;
}

message ProbabilisticHeader {
  option (gogoproto.goproto_getters) = false;

  Height trusted_height = 1;
  ProbabilisticBlock anchor_block = 2;
  repeated ProbabilisticBlock descendant_blocks = 3;
  string host_state_tx_hash = 4;
  reserved 5;
  uint32 host_state_tx_output_index = 6;
  reserved 7 to 9;
  repeated ProbabilisticBlock bridge_blocks = 10;
  EpochContext new_epoch_context = 11;
  // Checkpoints authenticate Cardano chain progression without creating an
  // IBC consensus state or renewing the trusting period.
  bool is_checkpoint = 12;
}
