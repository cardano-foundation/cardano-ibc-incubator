syntax = "proto3";
package vesseloracle.vesseloracle;

option go_package = "github.com/cardano-foundation/cardano-ibc-incubator/cosmos/vesseloracle-v10/x/vesseloracle/types";

message VesselIndexImo {
  message Key {
    string imo = 1;
    uint64 ts = 2;
    string source = 3;
  }
  repeated Key keys = 1;
}
